[package]
name = "tugmark"
version = "0.1.0"
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

# The markdown core shared by `tugmark-wasm` (the page) and tugcast
# (native). tugcast reaches it as a path dependency from outside this
# workspace, so nothing here may lean on the `tugrust` workspace.

[features]
default = []
# What only tugcast links: the sanitizer, the block renderer, the
# highlighter, and the chart compiler the find extraction reads a chart's
# text through. Nothing behind it may enter the WASM build.
native = [
    "dep:ammonia",
    "dep:serde_json",
    "dep:tuggraphics",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-json",
    "dep:tree-sitter-css",
    "dep:tree-sitter-html",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-swift",
]

[dependencies]
# Pinned exactly: `tugdeck/crates/Cargo.lock` and `tugrust/Cargo.lock`
# resolve this crate independently, and a block hash is only the same
# hash on both sides when both parse with the same version.
pulldown-cmark = { version = "=0.12.2", default-features = false, features = ["html", "simd"] }
ammonia = { version = "4", optional = true }
serde_json = { version = "1", optional = true }
# The find extraction's reading of a chart: `find_text` over the fence's
# spec, the same string the page's index projects through the WASM engine.
tuggraphics = { path = "../tuggraphics", optional = true }
# The fence highlighter. Every grammar crate is MIT. A language with no
# permissively licensed crate on this tree-sitter (dockerfile, astro), whose
# grammar needs injections (markdown), or whose queries are written for
# another editor's matcher (sql) is left for the page.
tree-sitter = { version = "0.25", optional = true }
tree-sitter-highlight = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
