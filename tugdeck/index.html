<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; font-src 'self' data:;">
  <title>tugdeck</title>
  <!-- Bundled @font-face rules, served statically from /public so they sit
       OUTSIDE Vite's HMR module graph and are never re-registered on a hot
       update. This is what keeps transcript text from flashing (blank or
       wrong-face) on every dev edit — see public/fonts.css for the full
       rationale. Loaded in <head> so the faces are registered before first
       paint. -->
  <link rel="stylesheet" href="/fonts.css">
  <!-- CJK families (JP/KR/SC/TC): each weight is pre-split into unicode-range
       subsets so the browser fetches only the subsets actually on screen.
       GENERATED by scripts/fetch-fonts.ts; absent until a CJK family is
       vendored. Same static-outside-HMR rationale as fonts.css. -->
  <link rel="stylesheet" href="/fonts-cjk.css">
</head>
<body style="margin:0;padding:0;overflow:hidden">
  <div id="deck-container"></div>
  <!-- Lead recorder, for `tugtool deck motion slide --tasks`. It names what
       runs on the main thread after a click: every timer, frame callback,
       microtask, promise reaction, port message and observer callback, with
       how long it ran, what queued it and from where. It has to be installed
       here for the same reason the census below is: React and its scheduler
       capture `queueMicrotask`, `setTimeout` and their MessageChannel when the
       vendor chunk evaluates, so a wrapper installed afterwards never sees
       them.

       It is installed ONLY when the verb asked for it — a sessionStorage flag
       the verb sets before reloading the deck, which a relaunch sheds. Off it,
       none of this runs. On it and unarmed, every wrapper passes straight
       through; the verb arms it for one click's window at a time.

       What it cannot see is left unattributed rather than guessed: listeners
       already registered for native events, `await` on a native promise, and
       the rendering update's own style and layout. -->
  <script>
    (function () {
      var wanted = false;
      try { wanted = window.sessionStorage.getItem("tug-lead-recorder") === "1"; } catch (e) {}
      if (!wanted) return;
      var native = {
        setTimeout: window.setTimeout.bind(window),
        requestAnimationFrame: window.requestAnimationFrame.bind(window),
        MutationObserver: window.MutationObserver
      };
      var armed = false, gen = 0, entries = [], current = -1, posts = [];
      // Every store change React was told of and every flushSync, with where
      // from; and the time of the first store snapshot read since the last
      // commit, which stands in for the render's start (production React
      // exposes none). A read made while React handles a tell is not one.
      var tells = [], pendingRead = null, telling = false;
      // The queueing site: the stack without this script's own frames, which
      // are the ones left with no file once the origin is stripped.
      function where(depth) {
        return String(new Error().stack || "").split("\n").map(function (l) {
          return l.replace(/https?:\/\/[^/]+\/(?:assets\/)?/, "");
        }).filter(function (l) {
          return !/@:\d+:\d+$/.test(l);
        }).slice(0, depth || 4).join(" < ");
      }
      function ticket(kind, stack) {
        return { kind: kind, stack: stack, parent: current, queued: performance.now(), gen: gen };
      }
      function run(t, fn, self, args) {
        var rec = {
          kind: t.kind, name: fn.name || "", stack: t.stack,
          parent: t.gen === gen ? t.parent : -1,
          queued: t.gen === gen ? t.queued : null,
          start: performance.now(), end: 0
        };
        var prev = current;
        current = entries.push(rec) - 1;
        try { return fn.apply(self, args); }
        finally { rec.end = performance.now(); current = prev; }
      }
      // A callback queued while armed, carrying where it was queued from.
      function queuedCallback(kind, cb) {
        if (typeof cb !== "function") return cb;
        var t = ticket(kind, where());
        return function () {
          return armed ? run(t, cb, this, arguments) : cb.apply(this, arguments);
        };
      }
      function wrapScheduler(owner, name, kind) {
        var original = owner[name];
        if (typeof original !== "function") return;
        owner[name] = function (cb) {
          if (!armed || typeof cb !== "function") return original.apply(this, arguments);
          var args = Array.prototype.slice.call(arguments);
          args[0] = queuedCallback(kind, cb);
          return original.apply(this, args);
        };
      }
      wrapScheduler(window, "setTimeout", "timeout");
      wrapScheduler(window, "setInterval", "interval");
      wrapScheduler(window, "requestAnimationFrame", "frame");
      wrapScheduler(window, "requestIdleCallback", "idle");
      wrapScheduler(window, "queueMicrotask", "microtask");

      var then = Promise.prototype.then;
      Promise.prototype.then = function (onFulfilled, onRejected) {
        if (!armed) return then.call(this, onFulfilled, onRejected);
        return then.call(this, queuedCallback("promise", onFulfilled), queuedCallback("promise", onRejected));
      };

      // A port's handler is set once, at load, and its messages are queued by
      // `postMessage` on the entangled port — which the handler cannot name.
      // The posts are kept in order and each message takes the oldest; the
      // scheduler's own channel is the traffic that matters here.
      var onmessage = Object.getOwnPropertyDescriptor(MessagePort.prototype, "onmessage");
      if (onmessage && onmessage.set) {
        Object.defineProperty(MessagePort.prototype, "onmessage", {
          configurable: true, enumerable: onmessage.enumerable, get: onmessage.get,
          set: function (handler) {
            if (typeof handler !== "function") return onmessage.set.call(this, handler);
            onmessage.set.call(this, function (event) {
              if (!armed) return handler.call(this, event);
              var t = posts.shift() || { kind: "message", stack: "", parent: -1, queued: null, gen: -1 };
              return run(t, handler, this, [event]);
            });
          }
        });
        var post = MessagePort.prototype.postMessage;
        MessagePort.prototype.postMessage = function () {
          if (armed) posts.push(ticket("message", where()));
          return post.apply(this, arguments);
        };
      }

      function wrapObserver(name, kind) {
        var Native = window[name];
        if (typeof Native !== "function") return;
        var Wrapped = function (cb, options) {
          var t = { kind: kind, stack: "", parent: -1, queued: null, gen: -1 };
          return new Native(function () {
            return armed ? run(t, cb, this, arguments) : cb.apply(this, arguments);
          }, options);
        };
        Wrapped.prototype = Native.prototype;
        window[name] = Wrapped;
      }
      wrapObserver("MutationObserver", "mutation-observer");
      wrapObserver("ResizeObserver", "resize-observer");
      wrapObserver("IntersectionObserver", "intersection-observer");

      window.__tugLead = {
        // The unwrapped originals, for the verb's own heartbeat and frame
        // recorder — which must not appear in what they measure.
        native: native,
        armed: function () { return armed; },
        current: function () { return current; },
        arm: function () {
          gen += 1; entries = []; posts = []; current = -1;
          tells = []; pendingRead = null; telling = false; armed = true;
        },
        disarm: function () { armed = false; var out = entries; entries = []; return out; },
        tells: function () { return tells; },
        // `lib/gesture-scope.ts` calls these three. `kind` is "store" or
        // "flushSync".
        tell: function (kind, label) {
          if (!armed) return;
          tells.push({ t: performance.now(), kind: kind, label: label, stack: where(6), task: current });
        },
        read: function () {
          if (armed && pendingRead === null && !telling) pendingRead = performance.now();
        },
        telling: function (flag) { telling = flag; },
        // The census takes the render start at each commit.
        takeRead: function () { var t = pendingRead; pendingRead = null; return t; },
        // Run `fn` as a named entry — the verb's dispatch of the click itself.
        run: function (kind, fn) { return run(ticket(kind, ""), fn, null, []); }
      };
    })();
  </script>
  <!-- React commit census ([B07]). The devtools-shaped hook must exist before
       react-dom evaluates, and a module import cannot promise that once the
       bundler hoists the vendor chunk, so it is installed here. Every commit
       is walked once for the fibers that performed work and recorded with a
       timestamp; read it with window.__tugCommits.since(t).

       It is installed ONLY in test mode, or beside the lead recorder above —
       and there it walks only while the recorder is armed. The walk is a
       whole-tree diff on every React commit — the most expensive instrument
       on the deck, and one that runs on the shipping path for nobody.
       `__tugTestMode` is written by a WKUserScript at atDocumentStart, so it
       is already there when this runs; off both, the hook is never installed
       and react-dom takes its ordinary no-devtools path. -->
  <script>
    (function () {
      var testMode = window.__tugTestMode === true;
      var lead = window.__tugLead;
      if (!testMode && !lead) return;
      if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__) return;
      var commits = [];
      function nameOf(type) {
        if (typeof type === "string") return type;
        if (typeof type === "function") return type.displayName || type.name || "fn";
        if (type && typeof type === "object") {
          return type.displayName || (type.render && type.render.name) ||
            (type.type && (type.type.displayName || type.type.name)) ||
            String(type.$$typeof && type.$$typeof.description || "obj");
        }
        return type === null ? "root" : String(type);
      }
      function same(a, b) {
        if (Object.is(a, b)) return true;
        if (typeof a !== "object" || typeof b !== "object" || a === null || b === null) return false;
        var pa = Object.getPrototypeOf(a), pb = Object.getPrototypeOf(b);
        if (Array.isArray(a) !== Array.isArray(b)) return false;
        if (!Array.isArray(a) && ((pa !== Object.prototype && pa !== null) || (pb !== Object.prototype && pb !== null))) return false;
        var ka = Object.keys(a), kb = Object.keys(b);
        if (ka.length !== kb.length) return false;
        for (var i = 0; i < ka.length; i += 1) if (!same(a[ka[i]], b[ka[i]])) return false;
        return true;
      }
      function census(root) {
        var t = performance.now();
        var counts = new Map();
        var labels = [];
        // WHY a watched component rendered: the prop keys whose identity
        // changed since its last render, or `[state/ctx]` when the props
        // object is the one it rendered with last time — a hook, not its
        // parent, asked for the render. Scoped to the pane chrome, which is
        // where a commit that moved one pane has repeatedly re-rendered all
        // of them.
        var why = [];
        var origins = new Map();
        var hookNotes = [];
        // `mounted` counts the performed fibers with no alternate: a mount,
        // which `performed` alone cannot tell from a re-render.
        var fibers = 0, performed = 0, mounted = 0;
        // A subtree React did not visit is the SAME object in both trees, and
        // its fibers keep the flags of whatever commit last rendered them —
        // so the walk carries the old tree beside the new one and stops where
        // the two are one object. Children are matched by index.
        var stack = [[root.current, root.current.alternate]];
        while (stack.length) {
          var pair = stack.pop();
          var f = pair[0], o = pair[1];
          if (f === o) continue;
          fibers += 1;
          if (o === null || (f.flags & 1)) {
            performed += 1;
            if (o === null) mounted += 1;
            var n = nameOf(f.type);
            counts.set(n, (counts.get(n) || 0) + 1);
            if (/^(TugButton|TugPushButton|TugConfirmPopover|TugPopover|TugTooltip|ResponderScope)/.test(n) && f.memoizedProps) {
              var p = f.memoizedProps;
              labels.push(n + "(" + (p.action || p["aria-label"] || p.title || p.label || p["data-slot"] || p.id || "") + ")");
            }
            var alt = f.alternate;
            // An ORIGIN: a component that rendered with the very props
            // object it rendered with last time, so its own state, a store
            // or a context asked — the top of a cascade rather than a
            // child carried along by it.
            if (alt && typeof f.type !== "string" && f.type !== null &&
                alt.memoizedProps === f.memoizedProps && (f.tag === 0 || f.tag === 1 || f.tag === 11 || f.tag === 14 || f.tag === 15)) {
              origins.set(n, (origins.get(n) || 0) + 1);
              // WHICH hook asked: the indices of the hook slots whose state
              // moved, each with a hint of what it holds, and any context
              // whose value moved. Only for the first few origins of a
              // commit, which is where a cascade starts.
              if (hookNotes.length < 12) {
                var h = f.memoizedState, ah = alt.memoizedState, i = 0, moved = [];
                while (h && ah && i < 80) {
                  if (!Object.is(h.memoizedState, ah.memoizedState)) {
                    var v = h.memoizedState, hint;
                    if (v === null || v === undefined) hint = String(v);
                    else if (typeof v !== "object") hint = typeof v === "function" ? "fn" : JSON.stringify(v).slice(0, 24);
                    else if (Array.isArray(v)) hint = "arr" + v.length;
                    else hint = "{" + Object.keys(v).slice(0, 4).join(",") + "}";
                    moved.push(i + ":" + hint);
                  }
                  h = h.next; ah = ah.next; i += 1;
                }
                var ctx = [];
                // Against the ALTERNATE's recorded reads: at commit a
                // context's current value has already popped back.
                var dep = f.dependencies && f.dependencies.firstContext;
                var adep = alt.dependencies && alt.dependencies.firstContext;
                var ci = 0;
                while (dep && ci < 40) {
                  if (!adep || !Object.is(dep.memoizedValue, adep.memoizedValue)) {
                    ctx.push(ci + ":" + (dep.context && dep.context.displayName || "ctx"));
                  }
                  dep = dep.next; adep = adep ? adep.next : null; ci += 1;
                }
                hookNotes.push(n + " hooks[" + moved.join(" ") + "]" + (ctx.length ? " ctx[" + ctx.join(",") + "]" : ""));
              }
            }
            if (alt && /^(TugPaneImpl|CardTitleBar|CardSlotBadge|LayerPanes|SessionMasthead|CardMasthead|SessionCardBody|CardHostImpl)\d*$/.test(n)) {
              var pp = alt.memoizedProps, np = f.memoizedProps, keys = [];
              // A key is named bare when its VALUE moved and with a `~` when
              // only its identity did — the second is what a by-value memo
              // comparator already forgives, so it is never the cause.
              if (pp && np && pp !== np) {
                for (var k in np) if (np[k] !== pp[k]) keys.push(same(np[k], pp[k]) ? "~" + k : k);
                for (var k2 in pp) if (!(k2 in np)) keys.push(k2);
              }
              var who = np && (np.activeCardId || (np.stackState && np.stackState.id) || np.cardId || np.spaceId) || "";
              why.push(n + (who ? "@" + who : "") + (pp === np ? "[state/ctx]" : "{" + keys.join(",") + "}"));
            }
          }
          var c = f.child, oc = o ? o.child : null;
          while (c) {
            stack.push([c, oc]);
            c = c.sibling;
            oc = oc ? oc.sibling : null;
          }
        }
        var top = Array.from(counts.entries()).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 12);
        return { t: t, fibers: fibers, performed: performed, mounted: mounted, top: top, labels: labels.slice(0, 24), why: why.slice(0, 32),
          origins: Array.from(origins.entries()).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 12),
          hooks: hookNotes };
      }
      var nextId = 1;
      var renderers = new Map();
      window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
        isDisabled: false, supportsFiber: true, supportsFlight: false, renderers: renderers,
        inject: function (r) { var id = nextId++; renderers.set(id, r); return id; },
        on: function () {}, off: function () {}, emit: function () {},
        sub: function () { return function () {}; },
        checkDCE: function () {}, setStrictMode: function () {},
        onCommitFiberUnmount: function () {}, onPostCommitRoot: function () {},
        // After passive effects: when the commit's last work ended. The
        // snapshot reads its subscription effects made are not a render
        // start, so the pending read is dropped.
        onPostCommitFiberRoot: function () {
          if (!lead || !lead.armed()) return;
          var last = commits[commits.length - 1];
          if (last) last.post = performance.now();
          lead.takeRead();
        },
        onCommitFiberRoot: function (_id, root) {
          if (!testMode && !lead.armed()) return;
          var commit = census(root);
          // What the walk itself cost, so a reading can set it aside, and
          // which recorded callback the commit ran inside.
          commit.ms = performance.now() - commit.t;
          commit.task = lead ? lead.current() : -1;
          // The first store snapshot read since the last commit: a lower
          // bound on where this commit's render began.
          commit.renderStart = lead ? lead.takeRead() : null;
          commit.post = null;
          commits.push(commit);
          if (commits.length > 400) commits.splice(0, commits.length - 400);
        }
      };
      window.__tugCommits = {
        since: function (t) { return commits.filter(function (c) { return c.t >= t; }); },
        all: function () { return commits.slice(); },
        renderers: function () { return renderers.size; }
      };
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
