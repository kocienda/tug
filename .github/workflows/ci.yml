name: CI

# The fast lane: what `just ci` runs but the Swift tests, split into three jobs
# so each lands under a five-minute budget. A job over budget is a red to
# investigate, not a number to raise. The slow suites — the Rust set that
# spawns git or the real tugcast, and `tugdeck/full-lane/` — and the Swift
# tests run in `full-lane.yml`, which the nightly and the release wait on; the
# WASM rebuild runs in `wasm.yml` when `tugdeck/crates/` changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Tug is a macOS app, so CI runs on the macOS runner the release and nightly
# workflows build on, and on nothing else.
jobs:
  # The Rust workspace minus the slow set, under nextest.
  rust-fast:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # No channel here: `rustup toolchain install` with no argument installs
      # what `tugrust/rust-toolchain.toml` pins, components included, so CI
      # compiles with the compiler local builds use.
      - name: Install Rust
        run: rustup toolchain install
        working-directory: tugrust

      # Restore here, save at the end with `if: always()`. A plain
      # `actions/cache` saves only when the job succeeds, so while a job is
      # red its cache is never written and every run compiles the whole
      # workspace cold.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ runner.os }}-cargo-rust-fast-${{ hashFiles('tugrust/rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-fast-

      # nextest, not `cargo test`: the shell feed tests set `$SHELL` and seed a
      # process-global PATH cache, which only holds when each test owns its own
      # process. It is also what `just test-rust` runs.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Rust fast lane
        run: just test-rust

      - name: Save cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The TypeScript checks and suites, the standalone plugin suite, and the
  # app-test covers check. Rust is installed here because `test-ts` and
  # `test-standalone` build tugtool with cargo: the app-test selector tests
  # drive the real `tugtool apptest reach` verb, and the standalone suite
  # drives the real hook script and arc verbs. The app-test corpus is not
  # here: it needs a built Tug.app.
  ts-fast:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install
        working-directory: tugrust

      # Restore here, save at the end with `if: always()`, as in `rust-fast`.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ runner.os }}-cargo-ts-fast-${{ hashFiles('tugrust/rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ts-fast-

      # The one bun: `.bun-version` is the pin every workflow reads, so the
      # tests run on the bun the checkout runs on rather than a floating patch.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd tugdeck
          bun install --frozen-lockfile --cwd tugcode
          bun install --frozen-lockfile --cwd tests/app-test

      - name: TypeScript lint
        run: just lint-ts

      - name: TypeScript tests
        run: just test-ts

      - name: Standalone test
        run: just test-standalone

      - name: App-test covers check
        run: just app-test-covers-check

      - name: Save cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The repository's own lints, shellcheck, the deck's audits, clippy and fmt.
  lint:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install
        working-directory: tugrust

      # Restore here, save at the end with `if: always()`, as in `rust-fast`.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('tugrust/rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install just
        uses: taiki-e/install-action@just

      # `just lint-audit` runs `shellcheck`, which the macOS image does not
      # carry.
      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd tugdeck
          bun install --frozen-lockfile --cwd tugcode
          bun install --frozen-lockfile --cwd tests/app-test

      - name: Audit lints
        run: just lint-audit

      - name: Rust lints
        run: just lint-rust

      - name: Save cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
