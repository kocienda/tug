name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Tug is a macOS app, so CI runs on the macOS runner the release and nightly
# workflows build on, and on nothing else.
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # No channel here: `rustup toolchain install` with no argument installs
      # what `tugrust/rust-toolchain.toml` pins, components included, so CI
      # compiles with the compiler local builds use.
      - name: Install Rust
        run: rustup toolchain install
        working-directory: tugrust

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tugrust/rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Cache tugdeck node_modules
        uses: actions/cache@v4
        with:
          path: tugdeck/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('tugdeck/bun.lock') }}

      - name: Install tugdeck dependencies
        run: bun install --frozen-lockfile
        working-directory: tugdeck

      - name: Build
        run: cargo build --all-targets
        working-directory: tugrust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # nextest, not `cargo test`: the shell feed tests set `$SHELL`/`$ZDOTDIR`
      # and seed a process-global PATH cache, which only holds when each test
      # owns its own process. It is also what `just test` runs.
      - name: Run tests
        run: cargo nextest run --workspace --all-targets --no-fail-fast
        working-directory: tugrust

  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install
        working-directory: tugrust

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: tugrust

  clippy:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install
        working-directory: tugrust

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Cache tugdeck node_modules
        uses: actions/cache@v4
        with:
          path: tugdeck/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('tugdeck/bun.lock') }}

      - name: Install tugdeck dependencies
        run: bun install --frozen-lockfile
        working-directory: tugdeck

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: tugrust

  # The TypeScript side runs the recipes the checkout already defines.
  # `just lint` carries clippy and `cargo fmt` as well as the typechecks and
  # oxlint, and `test-standalone` builds tugtool with cargo, so this job
  # installs Rust the way the build job does. The app-test corpus is not here:
  # it needs a built Tug.app.
  typescript:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install
        working-directory: tugrust

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ runner.os }}-cargo-ts-${{ hashFiles('tugrust/rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Install just
        uses: taiki-e/install-action@just

      # `just lint` runs `wasm-check`, which rebuilds every WASM package and
      # fails if it differs from the committed one. The bytes depend on the
      # compiler (pinned in `tugdeck/crates/rust-toolchain.toml`, with the
      # wasm32 target) and on wasm-pack, which picks the wasm-opt it runs, so
      # wasm-pack is pinned to the version the packages were built with.
      - name: Install the WASM toolchain
        run: rustup toolchain install
        working-directory: tugdeck/crates

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --cwd tugdeck
          bun install --frozen-lockfile --cwd tugcode
          bun install --frozen-lockfile --cwd tests/app-test

      - name: Lint
        run: just lint

      - name: TypeScript tests
        run: just test-ts

      - name: Standalone test
        run: just test-standalone

      - name: App-test covers check
        run: just app-test-covers-check
