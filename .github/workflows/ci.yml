name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tugrust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Cache tugdeck node_modules
        uses: actions/cache@v4
        with:
          path: tugdeck/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('tugdeck/bun.lock') }}

      - name: Install tugdeck dependencies
        run: bun install --frozen-lockfile
        working-directory: tugdeck

      - name: Build
        run: cargo build --all-targets
        working-directory: tugrust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # nextest, not `cargo test`: the shell feed tests set `$SHELL`/`$ZDOTDIR`
      # and seed a process-global PATH cache, which only holds when each test
      # owns its own process. It is also what `just test` runs.
      - name: Run tests
        run: cargo nextest run --workspace --all-targets --no-fail-fast
        working-directory: tugrust

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: tugrust

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Cache tugdeck node_modules
        uses: actions/cache@v4
        with:
          path: tugdeck/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('tugdeck/bun.lock') }}

      - name: Install tugdeck dependencies
        run: bun install --frozen-lockfile
        working-directory: tugdeck

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: tugrust
