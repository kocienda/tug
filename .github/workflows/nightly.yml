name: Nightly Build

# Credential handling
#
# All Apple credentials live in one ephemeral keychain created at the start of
# the job and destroyed at the end, whatever the outcome. The signing cert and
# the `tug-notary` notarytool profile both go in it, so the build step — which
# runs cargo, bun, xcodebuild and a from-source tmux build — carries no Apple
# secrets in its environment at all. It gets a path, not a password.
#
# This keeps notarize.sh on a single code path: it authenticates via the
# `tug-notary` keychain profile here exactly as it does on a developer machine.

on:
  schedule:
    # Run daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign and notarize, then publish to the nightly release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Scheduled runs always sign; dispatch runs honour the input. The unsigned
  # path needs no secrets, so it can exercise the whole build on a fork or
  # before certificates are in place.
  SIGNED: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.signed }}

jobs:
  build-nightly:
    # macos-26, not macos-15: the dictation host engine compiles against
    # SpeechAnalyzer / SpeechTranscriber, which exist only in the macOS 26
    # SDK. A macos-15 runner tops out at the 15.5 SDK, where those types
    # are simply not in scope, whatever @available says about the runtime.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # Pinned rather than left on the image default, so the SDK the nightly
      # is built against is the one the source was written against.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tugrust/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            tugdeck/node_modules
            tugcode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('tugdeck/bun.lock', 'tugcode/bun.lock') }}

      # tmux is compiled from source (libevent + ncurses + utf8proc, each with a
      # configure/make cycle) and dmgbuild bootstraps a pinned venv. Both are
      # content-addressed by their own scripts, so caching them turns roughly
      # fifteen minutes of cold build into a restore.
      - name: Cache build tools (tmux, dmgbuild)
        uses: actions/cache@v4
        with:
          path: |
            .tmux-build
            .build-tools
          key: ${{ runner.os }}-buildtools-${{ hashFiles('tugrust/scripts/fetch-tmux.sh', 'tugrust/scripts/dmg/ensure-dmgbuild.sh') }}

      # Creating the keychain and importing the cert are one step so the
      # keychain password stays in step scope. Split across two steps it would
      # have to travel via GITHUB_ENV and would then be readable by every
      # subsequent step, including the build.
      - name: Create keychain and import signing certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE is empty — the repository secret is unset."
            exit 1
          fi

          # RUNNER_TEMP is only reachable from step scope, so the path is
          # published to GITHUB_ENV here rather than declared at workflow level.
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend to the search list so codesign's identity lookup finds the
          # cert; keep the existing entries so system roots still resolve.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # `security import` reports every failure as "One or more parameters
          # were not valid", so the decode is checked separately to tell a
          # mangled secret apart from a wrong password.
          #
          # Validation is deliberately macOS-native. `security export` writes
          # p12s encrypted with RC2-40-CBC, which OpenSSL 3 (first on the PATH
          # of a GitHub macOS runner) refuses without the legacy provider — an
          # openssl-based check rejects perfectly valid certificates.
          CERT="$RUNNER_TEMP/certificate.p12"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT" 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. Re-export the .p12 and set the secret from a file, not the clipboard."
            exit 1
          fi
          echo "Decoded $(wc -c < "$CERT" | tr -d ' ') bytes of certificate data."

          if ! security import "$CERT" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
                 -T /usr/bin/codesign -T /usr/bin/security; then
            echo "::error::Could not import the certificate. Either APPLE_CERTIFICATE_PASSWORD does not match the .p12, or APPLE_CERTIFICATE decoded to something that is not a PKCS#12 archive."
            rm -f "$CERT"
            exit 1
          fi
          rm -f "$CERT"
          # Let codesign use the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # The import can succeed while yielding nothing codesign can use (a
          # certificate with no private key, or an expired one). Fail here,
          # where the cause is obvious, rather than an hour later in sign-bundle.
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
               | grep -q "Developer ID Application:"; then
            echo "::error::No 'Developer ID Application' identity in the keychain after import — the .p12 is missing its private key or the certificate has expired."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Provision notary profile
        if: env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials tug-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      # From here on, no Apple secrets are in scope — only the keychain path.
      - name: Build nightly DMG
        env:
          DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
          TUG_NOTARY_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
          TUG_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ARGS=(--nightly)
          if [ "$SIGNED" != "true" ]; then
            ARGS+=(--skip-sign --skip-notarize)
          fi
          tugrust/scripts/build-app.sh "${ARGS[@]}"

      - name: Destroy keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload unsigned DMG as artifact
        if: env.SIGNED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TugNightly-unsigned-${{ github.run_number }}
          path: products/TugNightly.dmg
          retention-days: 7

      - name: Publish to nightly release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: products/TugNightly.dmg
          body: |
            Automated nightly build of Tug.

            **⚠️ Warning:** This is a development build and may be unstable.

            Built from commit ${{ github.sha }} (build ${{ github.run_number }}).
          token: ${{ secrets.GITHUB_TOKEN }}
