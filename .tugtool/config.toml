[tugtool.dash]
# Commands run from a new dash worktree to hydrate it (deps, etc.).
# A git worktree never inherits gitignored files, so these install what a
# fresh checkout lacks. A non-zero exit rolls the worktree back.
post_create = ["bun install --cwd tugdeck", "bun install --cwd tugcode"]

# The run-ending's scoped fit check; {base}/{head} carry the replayed range.
# Schema and placeholder contract: DashConfig in tugutil-core/src/config.rs.
verify = "sh scripts/verify-fit.sh {base} {head}"

# The build offered at the end of a run with a face.
build = "just app-debug"

# Where this project's dash paperwork — briefs and plans — lives.
docs = "dash"

# The models the server-driven arc runs each stage on. Declaring one is a
# choice about this project's work, so all four are left undeclared here: a
# stage runs on the account default until somebody says otherwise.
# devise_model = "sonnet"
# review_model = "opus"
# implement_model = "sonnet"

# The context fraction above which the implement stage rotates to a fresh
# session at a step boundary — never mid-step. Undeclared, it is 0.6.
# implement_rotate_at = 0.6
