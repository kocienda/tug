[tugtool.arc]
# Commands run from a new arc worktree to hydrate it (deps, etc.).
# A git worktree never inherits gitignored files, so these install what a
# fresh checkout lacks. A non-zero exit rolls the worktree back.
post_create = [
  "bun install --cwd tugdeck",
  "bun install --cwd tugcode",
  "bun install --cwd tests/app-test",
]

# The build offered at the end of a run with a face.
build = "just app-debug"

# This checkout's supplement to the arc doctrine the plugin ships: its test
# commands, its app-test discipline, the test shapes it bans, and its state-zone
# mapping. The implement, audit and review stages read it after the plugin's.
doctrine = ["tuglaws/arc-supplement.md"]

# The laws the review cross-checks a plan against and the audit's fit check
# cites by label. Which code they govern is in the supplement.
laws = [
  "tuglaws/tuglaws.md",
  "tuglaws/design-decisions.md",
  "tuglaws/pane-model.md",
  "tuglaws/component-authoring.md",
]

# The models the server-driven arc runs each stage on. Declaring one is a
# choice about this project's work, so all four are left undeclared here: a
# stage runs on the account default until somebody says otherwise.
# devise_model = "sonnet"
review_model = "opus"
# implement_model = "sonnet"

# The audit stage reads the landed code cold against the plan it was written
# from and fixes what does not match, so it wants the strongest reader
# available, on the same grounds as the review.
audit_model = "opus"

# The context size, in tokens, above which a seated implement stage is
# compacted at a step boundary — never mid-step. A stage a compaction cannot
# bring back under this line rotates to a fresh session instead. Undeclared,
# it is 300000.
# implement_compact_tokens = 300000

# The commands the PreToolUse hook draws a run panel for, beside the runners
# tugtool knows (`tugtool run runners` lists both). A row with a `kind` is
# wrapped in `tugtool test run --kind <kind>`; a row with only a `unit` is a
# command that reports itself, and the hook puts the call id in front of it
# and nothing else, so its reports attach to the block exactly rather than by
# needle.
#
# Every recipe below reports through `tugtool progress` (report-phase.sh, the
# app-test recipe) or `tugtool test run`, or delegates to one that does. A
# recipe that reports nothing gets no row: the id would have nobody to carry
# it.
#
# Schema and refusals: Runner in tugtool-core/src/config.rs.

[[tugtool.run.runner]]
match = "just app-test"
unit  = "file"

[[tugtool.run.runner]]
match = "just app-test-changed"
unit  = "file"

[[tugtool.run.runner]]
match = "just app-test-build"
unit  = "file"

[[tugtool.run.runner]]
match = "just app-test-all"
unit  = "file"

[[tugtool.run.runner]]
match = "just app-test-smoke"
unit  = "file"

[[tugtool.run.runner]]
match = "just build"
unit  = "phase"

[[tugtool.run.runner]]
match = "just build-app"
unit  = "phase"

[[tugtool.run.runner]]
match = "just app-debug"
unit  = "phase"

[[tugtool.run.runner]]
match = "just app-release"
unit  = "phase"

[[tugtool.run.runner]]
match = "just test"
unit  = "test"

[[tugtool.run.runner]]
match = "just test-rust"
unit  = "test"

[[tugtool.run.runner]]
match = "just test-ts"
unit  = "test"

[[tugtool.run.runner]]
match = "just test-swift"
unit  = "phase"

[[tugtool.run.runner]]
match = "just test-standalone"
unit  = "phase"

[[tugtool.run.runner]]
match = "just golden"
unit  = "phase"

[[tugtool.run.runner]]
match = "just tugmark-fuzz"
unit  = "phase"

# The surfaces this project is made of. `tugtool arc verify <arc>` resolves
# every path an arc would land to the surface declaring the longest matching
# path, refuses — naming them — when one resolves to no surface, and runs what
# the matched surfaces declare. A path claimed by nothing is the table telling
# you it has fallen behind the tree; declare a surface for it.
#
# Schema and placeholder contract: Surface in tugtool-core/src/config.rs.

[[tugtool.arc.surface]]
name  = "rust"
paths = ["tugrust/"]
# `cargo nextest run` runs the whole workspace suite in one invocation. A step
# checkpoint naming a package or a file cannot see a cross-crate regression, and
# an arc's ending is the one place guaranteed to run. About 30 s, once per arc.
check = [
  "cd tugrust && cargo clippy --workspace --all-targets -- -D warnings",
  "cd tugrust && cargo nextest run",
]

[[tugtool.arc.surface]]
name  = "deck"
paths = ["tugdeck/"]
# Bare `bun test` runs every suite in ONE process, which is the only thing that
# sees a process-wide `mock.module` leak — the defect that put five red tests on
# main, because every checkpoint named files and no single run held both the
# mocking suite and its victim. About 5½ minutes (336 s measured 2026-10-03 and
# 2026-10-05) — the audit's one-process leak check, never a step's checkpoint; a
# step runs the files it touched.
check = [
  "cd tugdeck && bunx tsc --noEmit",
  "cd tugdeck && bunx vite build",
  "cd tugdeck && bun test",
  "just app-test-changed {paths}",
]

# Shadows `deck` by longest prefix: a change under tugdeck/crates/ runs the
# wasm build, not the vite one.
[[tugtool.arc.surface]]
name  = "wasm"
paths = ["tugdeck/crates/"]
check = ["just wasm"]

[[tugtool.arc.surface]]
name  = "code"
paths = ["tugcode/"]
check = ["cd tugcode && bunx tsc --noEmit"]

# One tracked file with no build of its own, checked by both consumers that
# import it.
[[tugtool.arc.surface]]
name       = "proto"
paths      = ["tugproto/"]
checked_by = ["deck", "code"]

[[tugtool.arc.surface]]
name  = "app"
paths = ["tugapp/"]
check = ["just test-swift", "just build-app", "just app-test-changed {paths}"]

[[tugtool.arc.surface]]
name  = "app-tests"
paths = ["tests/app-test/"]
check = ["cd tests/app-test && bunx tsc --noEmit", "just app-test-changed {paths}"]

[[tugtool.arc.surface]]
name  = "prose"
# `release-notes/` is prose too: one `<version>.md` per release, seeded by
# `version.sh` and embedded in the appcast. Nothing builds it, and the one
# thing that could go wrong with it — saying something the release does not
# do — is not a thing a command can check.
paths = ["tuglaws/", "briefs/", "release-notes/", "CLAUDE.md", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
check = []

[[tugtool.arc.surface]]
name  = "plugin"
paths = ["tugplug/", ".claude-plugin/"]
check = []

[[tugtool.arc.surface]]
name  = "project"
# `.claude/` is this project's own skills — `/spike-card` — which are Tug's
# alone and never plugin material. Nothing builds them.
# `tests/` is every scratch test directory beside the app-tests — shell
# scripts and rehearsal tools nothing builds. The longer `tests/app-test/`
# above still claims its own, so a directory that comes or goes here never
# leaves a path unclaimed.
paths = ["Justfile", "scripts/", ".github/", ".gitattributes", ".gitignore", ".shellcheckrc", ".tugtool/", ".claude/", "capabilities/", "diag/", "products/", "resources/", "tests/"]
check = []
