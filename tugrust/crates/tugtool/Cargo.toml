[package]
name = "tugtool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tugtool — the unified Tug developer CLI (changes & commits, arcs, host plumbing)"

[lib]
name = "tugtool"
path = "src/lib.rs"

[[bin]]
name = "tugtool"
path = "src/main.rs"

# The edit-program interpreter under its own name. Same package, so it
# reaches the receipt through the lib rather than copying it.
[[bin]]
name = "tugedit"
path = "src/bin/tugedit.rs"

[dependencies]
clap.workspace = true
libc.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
glob.workspace = true
chrono.workspace = true
roxmltree.workspace = true
regex.workspace = true
tugcore.workspace = true
tugtool-core.workspace = true
tugarc-core.workspace = true
tugchanges-core.workspace = true
tugedit-core.workspace = true
tugbank-core.workspace = true
rusqlite.workspace = true
sha2.workspace = true
ureq = { version = "3", features = ["json"] }
# The chart engine, for `--chart`: a verb's data as one validated
# `TUG-CHART:` line, and for `chart render`, which measures with the
# deck's own faces through the `font` feature. A path dependency from
# outside the `tugdeck/crates` workspace, like tugcast's `tugmark`.
tuggraphics = { path = "../../../tugdeck/crates/tuggraphics", features = ["font"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
serial_test = "3"
# The plan store and the arc ops, so a CLI test can stand up the state and
# the worktree a verb acts on rather than a substitute for either.
tugtool-core.workspace = true
tugarc-core.workspace = true
# The app-wide settings store, so a CLI test can seed the briefs-path key the
# way the app would rather than a substitute for it.
tugbank-core.workspace = true
# The hermetic git fixture, so no test reads the developer's git config.
tugcore = { workspace = true, features = ["test-fixtures"] }
