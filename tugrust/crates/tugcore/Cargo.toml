[package]
name = "tugcore"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared per-instance identity, path, and registry helpers for Tug binaries"

[lib]
name = "tugcore"
path = "src/lib.rs"

[features]
# The hostile-filename fixture [B05] and the hermetic git fixture
# (`test_fixtures::git`), compiled only where a test asks for them.
# Downstream crates enable it from dev-dependencies.
test-fixtures = []

[dependencies]
dirs = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serial_test = "3"
tempfile = { workspace = true }
