[package]
name = "tugcast"
description = "WebSocket multiplexer — bridges terminal, code, filesystem, and git feeds to tugdeck"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tugcast"
path = "src/main.rs"

[dependencies]
arc-swap = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
pty-process = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tuglog = { workspace = true }
tugcore = { workspace = true }
serde = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
notify = { workspace = true }
ignore = { workspace = true }
sysinfo = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
glob = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tower-http = { workspace = true }
tugcast-core = { path = "../tugcast-core" }
tugtool-core = { workspace = true }
tuggram = { workspace = true }
tugarc-core = { workspace = true }
tugchanges-core = { workspace = true }
tugbank-core = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
tokio-stream = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
# `test-util` gives tests a pausable clock, so a timeout whose ceiling is
# measured in seconds can be asserted without spending them.
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
tokio-tungstenite = { workspace = true }
http-body-util = { workspace = true }
# Captures the bytes a log line actually comes out as, so the field shapes
# `tests/model-eval/analyze.py` parses are pinned against the emitting call site
# rather than against a fixture someone copied by hand.
tracing-subscriber = { workspace = true }
# Owns the per-spawn changes DB so it is removed when the test ends
# rather than left in $TMPDIR (8,765 files had accumulated).
tempfile = { workspace = true }
# The base-motion tests redirect `TUG_DATA_DIR` so a replay's arc log lands in
# a tempdir instead of the developer's real state directory; the environment is
# process-wide, so those tests must not run beside each other.
serial_test = "3"
# The shared hostile-filename repo [B05]: a worktree seeded with a `ł`, a tab,
# a `"`, a newline and the rest, so a feed's path reading is proven against the
# names git quotes rather than against ASCII.
tugcore = { workspace = true, features = ["test-fixtures"] }

# Feature flag for real-claude integration tests. These tests spawn a
# real `claude` (tugcode) subprocess and must NEVER run in standard
# `cargo test` / `cargo nextest run` invocations — they exist solely to
# vet a new Claude Code version when one is released. The feature is
# off by default: real-claude test functions are `#[cfg(feature =
# "real-claude-tests")]`-gated so `cargo nextest list -p tugcast` does
# not even enumerate them, and `multi_session_real_claude` (which is
# 100 % real-claude content) has a `required-features` binding below
# so Cargo skips building the test binary entirely when the feature is
# off. To run on demand:
#
#   cargo test -p tugcast --features real-claude-tests \
#     --test multi_session_real_claude -- --ignored
#
# The `#[ignore]` + `TUG_REAL_CLAUDE` env gate remain in place as a
# second line of defense, so even `--features real-claude-tests
# --run-ignored only` without `TUG_REAL_CLAUDE=1` is a silent no-op.
[features]
real-claude-tests = []

[[test]]
name = "multi_session_real_claude"
path = "tests/multi_session_real_claude.rs"
required-features = ["real-claude-tests"]

