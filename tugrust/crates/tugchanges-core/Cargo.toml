[package]
name = "tugchanges-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core library for git changes & commits (changes/context/commit/log/diff)"

[lib]
name = "tugchanges_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
rusqlite.workspace = true
sha2.workspace = true
tugcore.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The hostile-filename fixture [B05] — one roster of unusual names, shared
# with tugarc-core rather than copied into it.
tugcore = { workspace = true, features = ["test-fixtures"] }
