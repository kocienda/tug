[package]
name = "tugutil"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tugutil — the unified Tug developer CLI (changes & commits, dashes, host plumbing)"

[lib]
name = "tugutil"
path = "src/lib.rs"

[[bin]]
name = "tugutil"
path = "src/main.rs"

# The edit-program interpreter under its own name. Same package, so it
# reaches the receipt through the lib rather than copying it.
[[bin]]
name = "tugedit"
path = "src/bin/tugedit.rs"

[dependencies]
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
regex.workspace = true
glob.workspace = true
chrono.workspace = true
tugcore.workspace = true
tugutil-core.workspace = true
tugdash-core.workspace = true
tugchanges-core.workspace = true
tugedit-core.workspace = true
rusqlite.workspace = true
sha2.workspace = true
uuid.workspace = true
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
serial_test = "3"
