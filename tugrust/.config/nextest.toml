# The one Rust hang guard: a test still running after three 60 s periods is
# terminated and recorded as a failure, with a 10 s grace to unwind. Far
# above any real test on any machine; a slow test never fails, a hung one
# ends named rather than holding the run until the CI job's own timeout.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }

# Per-test slow-timeout overrides.
#
# Nextest's default slow threshold is 60s, with SLOW warnings repeating at
# each multiple. A few deliberately long real-claude tests exceed that —
# stretch their threshold so the warnings don't clutter the output and hide
# signal.
#
# - `capture_all_probes` drives 35 probes × `TUG_STABILITY=3` runs against a
#   real claude CLI (~5–6 min end-to-end). Already feature-gated off by
#   default (`--features real-claude-tests`).
# - `stream_json_catalog_drift_regression` replays the probe catalog against
#   live claude (~2 min). Same feature gate.

[[profile.default.overrides]]
filter = 'test(capture_all_probes)'
slow-timeout = "15m"

[[profile.default.overrides]]
filter = 'test(stream_json_catalog_drift_regression)'
slow-timeout = "5m"

# Every run writes a junit document, read by `tugtool test run` (the
# `test-rust` recipe) into the test results ledger, so `tugtool test last
# --failures` names a red run's failures without running it again. Written to
# `target/nextest/default/junit.xml`.
[profile.default.junit]
path = "junit.xml"
