./tugplug\"\nif [ -d \"$SRC_PLUGIN\" ]; then\n  rm -rf \"$DST_RES/tugplug\"\n  mkdir -p \"$DST_RES/tugplug\"\n  cp -R \"$SRC_PLUGIN/\" \"$DST_RES/tugplug/\"\nelse\n  echo \"error: $SRC_PLUGIN not found -- tugplug source missing\" >&2\n  exit 1\nfi\n";
